name: Windows build and tests
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        asan: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake -S . -B out/build/ci -G "Visual Studio 17 2022" -A x64 -DTDSPEED_BUILD_TESTS=ON -DTDSPEED_ENABLE_ASAN=${{ matrix.asan }} "-DCMAKE_CXX_FLAGS=/MP4 /EHsc"
      - name: Build
        run: cmake --build out/build/ci --config Release --parallel 4
      - name: Test
        run: ctest --test-dir out/build/ci -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ matrix.asan }}
          path: |
            out/build/ci/Testing/Temporary/*.log
            out/build/ci/audit/engine-audit.json
            out/build/ci/TDSpeedApp_artefacts/Release/TDSpeedPreview.exe
            out/build/ci/TDSpeedVST_artefacts/Release/VST3/TDSpeedPreview.vst3
